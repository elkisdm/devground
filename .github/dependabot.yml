version: 2

updates:
  # Root workspace + all packages
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Santiago
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      # Group dev dependencies together to reduce PR noise
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Los majors de dev llegan juntos en un solo PR (ADR-0026: la fase de
      # consolidación cerró el 2026-09-07).
      dev-dependencies-major:
        dependency-type: development
        update-types:
          - major
      # Group production dependencies separately
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      production-dependencies-major:
        dependency-type: production
        update-types:
          - major

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Santiago
    open-pull-requests-limit: 3
    ignore:
      # changesets/action v2 requiere @changesets/cli v3; se sube junto con la
      # migración de la CLI, no por bump automático (ver release.yml).
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
