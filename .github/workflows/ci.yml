name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Permisos mínimos: el job de CI solo necesita leer el repo.
permissions:
  contents: read

# Cancela runs obsoletos del mismo ref (PR que recibe pushes seguidos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # La línea 22 se prueba en el mínimo que declaran los `engines` (22.22.1,
    # lo que exige lint-staged 17), no en la última 22: así un piso falso
    # rompe el CI en vez de romperle la instalación a un usuario. `node` queda
    # como etiqueta porque es parte del nombre del check que exige main.
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            version: 22.22.1
          - node: 24
            version: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm -r recorre todos los packages del workspace (packages/*); salta los que no
      # definan el script (no falla por ausencia).
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # Gate de cobertura (ADR-0012 + ADR-0025): corre coverage donde el paquete
      # define el script y FALLA bajo umbral. Los umbrales de rutas críticas
      # (dinero/leads/auth) viven en @devground/vitest-config; el piso global con
      # ratchet lo pone el vitest.config de cada consumidor. `pnpm -r` salta los
      # paquetes sin script `test:coverage` (no falla por ausencia), así que este
      # gate se activa por-paquete a medida que adoptan el estándar.
      - name: Coverage gate
        run: pnpm -r test:coverage

      # Lint de repo completo: eslint sobre todo el repo con el eslint.config.js
      # raíz (además del lint-staged en pre-commit, ADR-0005).
      - name: Lint
        run: pnpm lint

      # Seguridad de dependencias: bloquea desde severidad alta. Una transitiva
      # sin versión arreglada del padre se acota con `pnpm.overrides` en el
      # package.json raíz; no se vuelve a apagar este paso.
      - name: Audit de dependencias
        run: pnpm audit --audit-level=high

  # El E2E vive en el workflow CI a propósito: Release se dispara con
  # `workflow_run` del CI exitoso, así que también depende de este job.
  e2e:
    name: E2E instalación (${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # El proyecto de prueba se instala con cada gestor: el CLI elige
    # `npm install -D` o `pnpm add -D` según el lockfile que encuentra.
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # El script configura git user por proyecto de prueba (git config local).
      - name: E2E instalación
        run: bash packages/devground/test/quickstart.e2e.sh
        env:
          E2E_PM: ${{ matrix.pm }}
