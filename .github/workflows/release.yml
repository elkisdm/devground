name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      # OIDC: necesario para que npm genere provenance (provenance=true en .npmrc).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 llegó a fin de vida en abril de 2026; los runners lo deprecan.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        # v2 no publica un tag flotante `v2`: hay que fijar la versión exacta.
        # Rupturas respecto de v1, todas aplicadas aquí: los inputs se renombraron
        # (publish → publish-script, commit → commit-message, title → pr-title),
        # el token va por el input `github-token` (la variable de entorno ya no
        # se lee) y los commits/tags se empujan vía API de GitHub, con lo que
        # los hooks de husky no intervienen en el commit del bot.
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm publish-packages
          # Mensaje convencional: el repo consume su propio commitlint (PR #84).
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
