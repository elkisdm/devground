name: Release

# Publicar depende de validar: Release corre solo cuando el workflow CI terminó
# con éxito sobre un push a main. Antes ambos arrancaban en paralelo con el mismo
# push y un commit con CI rojo podía llegar a npm.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    # - conclusion == success: el CI de ese commit pasó (typecheck, build, test,
    #   coverage, lint).
    # - event == push: un CI de pull_request nunca publica.
    # - github.sha == head_sha: en workflow_run, github.sha es la punta ACTUAL de
    #   main, y changesets/action trabaja sobre ella. Si llegó un commit más nuevo
    #   mientras corría el CI, este run se salta: el del commit nuevo publicará
    #   cuando SU CI pase. Así nunca se publica código que no pasó CI.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.sha == github.event.workflow_run.head_sha
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      # OIDC: necesario para que npm genere provenance (provenance=true en .npmrc).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # El commit exacto que pasó CI (igual a github.sha por el `if` de arriba).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 llegó a fin de vida en abril de 2026; se publica con Node 24 (LTS activo).
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        # Se queda en v1 a propósito: changesets/action v2 exige @changesets/cli v3
        # (probado en main el 2026-09-15: "Changesets CLI v2 is not supported"), y
        # migrar la CLI es una decisión aparte — v3 deja de versionar paquetes
        # privados por defecto (deepcheck), cambia `prettier` por `format` en el
        # config y sale con código 1 sin changesets. dependabot.yml ignora ese
        # major hasta que se haga esa migración. Cuando se haga: v2 renombra los
        # inputs (publish-script, commit-message, pr-title), exige github-token
        # como input y no publica tag flotante `v2` (fijar la versión exacta).
        uses: changesets/action@v1
        with:
          publish: pnpm publish-packages
          # Mensaje convencional: el repo consume su propio commitlint (PR #84).
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
