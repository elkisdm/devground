# Ruff — configuracion base de devground (ADR-0035).
#
# Reglas conservadoras a proposito: errores reales de pyflakes + pycodestyle +
# orden de imports. Un preset agresivo en un repo existente produce cientos de
# hallazgos el primer dia y termina desactivado. Las familias B/C4/SIM/UP se
# agregan en pasadas posteriores, cuando el equipo ya vive con esto.

line-length = 120
target-version = "py312"

[lint]
# E4/E7/E9: pycodestyle (sintaxis, indentacion, espacios)
# F:        pyflakes (imports sin usar, nombres indefinidos, f-strings rotos)
# I:        isort (orden de imports)
# W:        pycodestyle warnings (fin de linea, espacios al final)
select = ["E4", "E7", "E9", "F", "I", "W"]

# E501 lo cubre line-length; bloquear por el ademas solo duplica ruido.
ignore = ["E501"]

[lint.per-file-ignores]
# Los tests re-importan fixtures y las redefinen: es su forma normal de operar.
"tests/**/*" = ["F401", "F811"]
# Un __init__.py existe para re-exportar.
"**/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
