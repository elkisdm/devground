[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# FastAPI es async de punta a punta: sin esto, cada test asincrono se marca
# como "skipped" en silencio y la suite pasa en verde sin haber corrido nada.
#
# REQUIERE el plugin:  pip install pytest-asyncio
# Sin el, pytest avisa "Unknown config option: asyncio_mode" y vuelve a saltarse
# los tests async — es decir, reproduce exactamente la falla que esto evita.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
